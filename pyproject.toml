[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-triage-ai"
version = "0.1.0"
description = "A Monday morning briefing for public GitHub maintainers."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pydantic>=2,<3", "litellm", "rich"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
repo-triage = "repo_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
