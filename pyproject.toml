[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-triage-ai"
version = "0.1.0"
description = "A Monday morning briefing for public GitHub maintainers."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31", "pydantic>=2,<3", "litellm", "rich", "python-dotenv"
]

[project.optional-dependencies]
dev = ["pytest>=7"]
word = ["python-docx>=1.1"]

[project.scripts]
repo-triage = "repo_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D103"]
